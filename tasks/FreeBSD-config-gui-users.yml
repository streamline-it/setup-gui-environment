---
- name: make sure user isn't already setup for gui use
  register: setup_gui_environment_group_check
  changed_when: false
  loop:
    "{{ setup_gui_environment_user }}"
  ansible.builtin.command:
    cmd: "id {{ item['username'] }}"

#
# Multiple user 
#
- name: ensure user is member of the video group (multiple users)
  debugger: on_failed
  loop:
    "{{ setup_gui_environment_user }}"
  loop_control:
    index_var: setup_gui_environment_loop_index
  when: 
    - setup_gui_environment_user | length > 1
    - "'video' not in setup_gui_environment_group_check['results'][setup_gui_environment_loop_index]['stdout']"
  ansible.builtin.command:
    cmd: "pw groupmod -n video -m {{ item['username'] }}"

#
# Single user 
#
- name: ensure user is member of the video group (single user)
  debugger: on_failed
  when: 
    - setup_gui_environment_user | length == 1
    - "'video' not in setup_gui_environment_group_check['results'][0]['stdout']"
  ansible.builtin.command:
    cmd: "pw groupmod -n video -m {{ setup_gui_environment_user[0]['username'] }}"
