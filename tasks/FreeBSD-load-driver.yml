---
- name: load the driver in rc.conf
  tags: gui
  loop:
    "{{ setup_gui_environment_sysrc_directive }}"
  community.general.sysrc:
    name: "{{ item['name'] }}"
    value: "{{ item['value'] }}"
    delim: " "

- name: load the driver in the loader.conf
  ansible.builtin.lineinfile:
    path: /boot/loader.conf
    line: "{{ setup_gui_environment_driver_name }}_load=\"YES\""
