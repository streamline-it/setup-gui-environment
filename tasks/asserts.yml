---
- name: ensure following variables are defined for FreeBSD hosts
  tags: gui
  when: ansible_os_family == "FreeBSD"
  ansible.builtin.assert:
    that:
      - setup_gui_environment_sysrc_directive is defined
      - setup_gui_environment_driver_name is defined
      - setup_gui_environment_driver_pkg is defined
      - setup_gui_environment_user is defined
